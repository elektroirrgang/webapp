<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Brother-Test</title>
<style>body{font:17px/1.4 system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#fcfcfd;color:#1f1f22}h1{font-size:22px}button{display:block;width:100%;margin:10px 0;padding:16px;border:0;border-radius:24px;background:#FFDAD8;color:#410006;font:700 17px system-ui}p{color:#4a4d55}#log{white-space:pre-wrap;font-size:14px;color:#4a4d55}</style></head><body>
<h1>Brother-Test (nur zum Ausprobieren)</h1><p>Jeden Knopf einmal tippen. Notier dir die Nummer, bei der im Teilen-Menü „Pro Label“ erscheint.</p>
<button data-f="knx.lbxs" data-t="">1 · .lbxs ohne Typ</button>
<button data-f="knx.lbxs" data-t="application/zip">2 · .lbxs als ZIP</button>
<button data-f="knx.lbxs" data-t="application/octet-stream">3 · .lbxs als Binärdatei (wie bisher)</button>
<button data-f="knx.lbx" data-t="">4 · .lbx ohne Typ</button>
<button data-f="knx.lbx" data-t="application/zip">5 · .lbx als ZIP</button>
<button data-f="knx.lbx" data-t="application/octet-stream">6 · .lbx als Binärdatei</button>
<div id="log"></div>
<script>
document.querySelectorAll("button").forEach(b=>b.onclick=async()=>{ const log=document.getElementById("log");
  try{ const r=await fetch(b.dataset.f+"?"+Date.now()); const blob=await r.blob(); const name="KNX 6.1 1-36 Test "+b.textContent.split(" ")[0]+b.dataset.f.slice(3);
    const f=new File([blob],name,b.dataset.t?{type:b.dataset.t}:{}); const ok=!!(navigator.canShare&&navigator.canShare({files:[f]}));
    log.textContent=b.textContent+": Teilen möglich = "+(ok?"ja":"nein");
    if(ok) await navigator.share({files:[f]}); else { const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=name; a.click(); log.textContent+=" → heruntergeladen"; }
  }catch(e){ log.textContent=b.textContent+": "+(e.name||e); } });
</script></body></html>
