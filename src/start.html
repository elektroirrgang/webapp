/* Statusleiste (iOS-Web-App, black-translucent): eigener, undurchsichtiger Streifen statt System-Glas */
:root{--sb:#C8102E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sb:var(--surface)}}
:root[data-theme="dark"]{--sb:var(--surface)}
html::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--sb);z-index:2147483000;pointer-events:none}
/* Pop-up offen: Hintergrund steht still (iOS 16+ und Android respektieren overflow:hidden am html) */
html.scroll-sperre,html.scroll-sperre body{overflow:hidden!important;overscroll-behavior:none}
#scrim{touch-action:none;overscroll-behavior:none}
#dlg{overscroll-behavior:contain}
/* iOS stellt Datum/Uhrzeit mittig dar – linksbündig wie alle anderen Felder */
input[type=date],input[type=time]{text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
@supports (-webkit-touch-callout:none){ input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:1.5em} }

/* Kopfleiste: Mindesthöhe inkl. Statusleiste, falls die JS-Messung beim Start der Home-Bildschirm-App zu früh lief */
:root{--tbmin:calc(env(safe-area-inset-top,0px) + 64px)}

const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

const initials=n=>(n||"?").split(/[\s.@]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("")||"?";
function tf(path,label,val,o={}){
  const cls=["tf"]; if(o.full) cls.push("full"); if(o.ph||o.type==="date") cls.push("fl"); if(o.sfx) cls.push("has-sfx");
  const bind=o.form?`data-f="${esc(path)}"`:`data-bind="${esc(path)}"`, id=o.form?"f_"+path:path;
  return `<div class="${cls.join(" ")}"><input id="${esc(id)}" ${bind} ${o.list?`data-vl="${o.list}"`:""} type="${o.type||"text"}" ${o.im?`inputmode="${o.im}"`:""} value="${esc(val)}" placeholder="${esc(o.ph||" ")}" autocomplete="off"><label for="${esc(id)}">${esc(label)}</label>${o.sfx?`<span class="sfx">${esc(o.sfx)}</span>`:""}</div>`;
}
function ta(path,label,val,o={}){
  const bind=o.form?`data-f="${esc(path)}"`:`data-bind="${esc(path)}"`, id=o.form?"f_"+path:path;
  return `<div class="tf${o.ph?" fl":""}${o.full?" full":""}"><textarea id="${esc(id)}" ${bind} placeholder="${esc(o.ph||" ")}">${esc(val)}</textarea><label for="${esc(id)}">${esc(label)}</label></div>`;
}
function sf(path,label,val,opts,o={}){
  const bind=o.form?`data-f="${esc(path)}"`:`data-bind="${esc(path)}"`, id=o.form?"f_"+path:path;
  return `<div class="tf fl${o.full?" full":""}"><select id="${esc(id)}" ${bind}>${opts.map(x=>{ const [v,t]=Array.isArray(x)?x:[x,x]; return `<option value="${esc(v)}" ${v===val?"selected":""}>${esc(t||"–")}</option>`; }).join("")}</select><label for="${esc(id)}">${esc(label)}</label><span class="arr">${icon("drop")}</span></div>`;
}
const datalist=(id,vals)=>`<datalist id="${id}">${[...new Set(vals.map(v=>String(v||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de",{numeric:true})).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`;
const seg=(act,cur,opts,cls="")=>`<div class="seg ${cls}" role="group">${opts.map(([v,t])=>`<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${icon("check")}${esc(t)}</button>`).join("")}</div>`;
