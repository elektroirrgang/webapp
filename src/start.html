.vl{position:fixed;z-index:96;background:var(--sc-high);border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);overflow:auto;overscroll-behavior:contain;animation:menuAuf .16s cubic-bezier(.2,.8,.2,1);transform-origin:top center}

/* Filter in der Suchleiste */
.search.mit-f{padding-right:6px}
.search input{flex:1;min-width:0}
.such-f{flex:none;position:relative;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--on-sv);display:grid;place-items:center;cursor:pointer}

.fpop{position:fixed;z-index:96;background:var(--sc-high);border-radius:24px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);overflow:auto;overscroll-behavior:contain;animation:menuAuf .16s cubic-bezier(.2,.8,.2,1);transform-origin:top right}
.fp-t{font-size:13px;font-weight:700;color:var(--on-sv);margin:4px 8px 6px}
.fp-t:not(:first-child){margin-top:14px}
.fp-sort{display:flex;flex-direction:column;gap:2px}
.fp-i{border:0;background:transparent;color:var(--on-surface);text-align:left;font:inherit;font-size:16px;min-height:44px;padding:10px 12px;border-radius:12px;cursor:pointer}
.fp-i:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.fp-i.an{background:var(--sec-c);color:var(--on-sec-c);font-weight:600}
.fp-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.fp-c{border:0;background:var(--sc-highest);color:var(--on-surface);font:inherit;font-size:14px;font-weight:600;height:36px;padding:0 14px;border-radius:18px;cursor:pointer}
.fp-c.an{background:var(--sec-c);color:var(--on-sec-c)}
.fp-f{display:flex;justify-content:flex-end;margin-top:10px}
.abc-gr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:12px}
.abc-b{position:sticky;top:8px;font-size:24px;font-weight:700;color:var(--primary);text-align:center;line-height:56px}
.abc-l .list{margin:0}
@media (max-width:743.98px){.abc-gr{grid-template-columns:28px minmax(0,1fr);gap:4px}.abc-b{font-size:20px;line-height:48px}}
.f-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

function openStores(name,stores,meta){ return new Promise((res,rej)=>{
  if(!window.indexedDB) return rej(0);
  const anlegen=db=>{ stores.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:"id"}); }); if(meta&&!db.objectStoreNames.contains("meta")) db.createObjectStore("meta"); };
  const r=indexedDB.open(name);
  r.onupgradeneeded=()=>anlegen(r.result);
  r.onsuccess=()=>{ const db=r.result, fehlt=stores.some(s=>!db.objectStoreNames.contains(s))||(meta&&!db.objectStoreNames.contains("meta"));
    if(!fehlt){ db.onversionchange=()=>db.close(); return res(db); }
    const v=db.version+1; db.close(); const r2=indexedDB.open(name,v);
    r2.onupgradeneeded=()=>anlegen(r2.result); r2.onsuccess=()=>{ r2.result.onversionchange=()=>r2.result.close(); res(r2.result); }; r2.onerror=()=>rej(r2.error); };
  r.onerror=()=>rej(r.error); }); }
