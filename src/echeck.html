function kzAusfuehren(zid,wegIds){

    w.deleted=true; w.mergedInto=zid; saveRec("kunden",w);

    const [bleibt,...rest]=[...g].sort((a,b)=>sRefs(b)-sRefs(a)||(a.created||0)-(b.created||0));
    for(const w of rest){ for(const f of ["strasse","plz","ort","adresse","ansprech","tel","notiz"]) if(!bleibt[f]&&w[f]) bleibt[f]=w[f];
