function openStores(name,stores,meta){ return new Promise((res,rej)=>{
  if(!window.indexedDB) return rej(0);
  const anlegen=db=>{ stores.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:"id"}); }); if(meta&&!db.objectStoreNames.contains("meta")) db.createObjectStore("meta"); };
  const r=indexedDB.open(name);
  r.onupgradeneeded=()=>anlegen(r.result);
  r.onsuccess=()=>{ const db=r.result, fehlt=stores.some(s=>!db.objectStoreNames.contains(s))||(meta&&!db.objectStoreNames.contains("meta"));
    if(!fehlt){ db.onversionchange=()=>db.close(); return res(db); }
    const v=db.version+1; db.close(); const r2=indexedDB.open(name,v);
    r2.onupgradeneeded=()=>anlegen(r2.result); r2.onsuccess=()=>{ r2.result.onversionchange=()=>r2.result.close(); res(r2.result); }; r2.onerror=()=>rej(r2.error); };
  r.onerror=()=>rej(r.error); }); }

/* Statusleiste (Android: theme-color) folgt der Farbe, die oben am Bildschirm tatsächlich zu sehen ist */
(()=>{ const meta=document.querySelector('meta[name="theme-color"]'); if(!meta) return; let plan=0, alt="";
  const rgba=s=>{ const m=String(s).match(/rgba?\(([^)]+)\)/); if(!m) return null; const p=m[1].split(/[ ,/]+/).filter(Boolean).map(Number); return [p[0],p[1],p[2],p.length>3?p[3]:1]; };
  const hex=c=>"#"+c.slice(0,3).map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
  const grund=el=>{ for(let e=el;e&&e.nodeType===1;e=e.parentElement){ const c=rgba(getComputedStyle(e).backgroundColor); if(c&&c[3]>=.95) return c; } return rgba(getComputedStyle(document.body).backgroundColor)||[252,252,253,1]; };
  const mische=(u,o)=>[0,1,2].map(i=>o[i]*o[3]+u[i]*(1-o[3]));
  function setzen(){ plan=0; try{
    const x=Math.round(innerWidth/2), stapel=document.elementsFromPoint(x,1).filter(e=>e!==document.documentElement);
    let farbe=null, ueber=[];
    for(const e of stapel){ const c=rgba(getComputedStyle(e).backgroundColor); if(!c||c[3]===0) continue; if(c[3]>=.95){ farbe=c; break; } ueber.push(c); }
    if(!farbe) farbe=grund(stapel[stapel.length-1]||document.body);
    let f=farbe.slice(0,3); for(let i=ueber.length-1;i>=0;i--) f=mische(f,ueber[i]);
    const h=hex(f); if(h!==alt){ alt=h; meta.setAttribute("content",h); } }catch(e){} }
  const bald=()=>{ if(!plan) plan=requestAnimationFrame(setzen); };
  window.sbFarbe=bald;
  new MutationObserver(bald).observe(document.documentElement,{attributes:true,subtree:true,childList:true,attributeFilter:["class","hidden","data-theme","style"]});
  addEventListener("scroll",bald,{passive:true}); addEventListener("resize",bald);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>setTimeout(bald,50));
  document.addEventListener("transitionend",bald,true); bald();
})();
