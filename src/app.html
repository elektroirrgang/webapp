  .stabs{position:sticky;top:var(--tbh,72px);z-index:5;display:flex;gap:4px;width:max-content;max-width:100%;margin:-4px 0 20px;padding:4px;border-radius:24px;background:var(--sc-high);box-shadow:0 0 0 10px var(--surface)}
  .stabs .tab{flex:none;height:40px;max-width:none;padding:0 20px;border-radius:20px;font-size:15px;font-weight:650;color:var(--on-sv);transition:background .2s,color .2s}
  .stabs .tab .tl::after{display:none!important}
  .stabs .tab[aria-selected="true"]{background:var(--surface);color:var(--on-surface);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .stabs .sd{margin-left:8px}
  .card{background:var(--sc);border-radius:24px;padding:20px 24px 24px}
  .card h3{font-size:18px;margin:0 0 18px}
  .cols{gap:20px}
  .fg{gap:18px 24px!important}
  .seg{max-width:none!important;min-height:44px;border-radius:22px}
  .lbl{margin-left:2px}
  .akte-link{display:inline-flex!important;align-items:center;gap:6px;height:auto;padding:6px 2px;margin-top:4px}
  .akte-link .ic{width:20px;height:20px;margin:0}
}
@media (min-width:744px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stabs .tab[aria-selected="true"]{background:var(--on-surface);color:var(--surface)}}
@media (min-width:744px){:root[data-theme="dark"] .stabs .tab[aria-selected="true"]{background:var(--on-surface);color:var(--surface)}}

@media (min-width:744px){
  .stabs-band{position:sticky;top:var(--tbh,72px);z-index:5;background:var(--surface);margin:-8px -12px 12px;padding:4px 12px 8px}
  .stabs{position:static!important;margin:0!important;box-shadow:none!important}
}

@media (min-width:744px){
  .sk .stabs{flex:none;margin-top:2px!important;height:48px}
  .sk:has(.spick){position:sticky;top:var(--tbh,72px);z-index:5;background:var(--surface);margin:0 -12px 12px!important;padding:12px 12px 8px}
}

@media (min-width:744px){
  .schips{flex:none;display:flex;gap:8px;margin-top:6px}
  .schip{height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--outline);background:transparent;color:var(--on-surface);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
  .schip:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
  .schip[aria-selected="true"]{background:var(--sec-c);color:var(--on-sec-c);border-color:var(--sec-c)}
  .schip .sd{width:10px;height:10px;flex:none}
  .schip:has(.sd.ok):not([aria-selected="true"]){border-color:color-mix(in srgb,var(--ok) 55%,var(--outline))}
  .schip:has(.sd.bad):not([aria-selected="true"]){border-color:var(--err);color:var(--err)}
  .schip[aria-selected="true"]:has(.sd.bad){background:var(--err-c);color:var(--on-err-c);border-color:var(--err-c)}
}

@media (min-width:744px){
  .spick{flex:none;margin-top:4px;height:44px;min-width:210px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-radius:12px;border:1px solid var(--outline);background:var(--sc);color:var(--on-surface);font-size:16px;font-weight:650;-webkit-tap-highlight-color:transparent;transition:background .15s}
  .spick:hover,.spick:active{background:var(--sc-high)}
  .spick .sd{width:10px;height:10px;flex:none}
  .spick-t{flex:1;text-align:left;white-space:nowrap}
  .spick-p{display:grid;transform:rotate(90deg);color:var(--on-sv)}
  .spick-p .ic,.spick-ic .ic{width:20px;height:20px}
  .spick-ic{display:grid;color:var(--on-sv)}
  .spick:has(.sd.bad){border-color:var(--err)}
  .spick-mi .sd{width:10px;height:10px;flex:none;margin:0 7px}
  .spick-mi > span:not(.spick-ic){flex:1}.spick-mi .spick-ic{flex:none;width:24px;place-items:center}.spick-mi .sd{margin:0 7px!important}
  .spick-mi small{font-size:12px;color:var(--on-sv);font-weight:600}
  .spick-mi.an{background:color-mix(in srgb,var(--primary) 12%,transparent)}
  .spick-mi > .ic:last-child{color:var(--primary)}
}

/* iPad/PC: gefüllte Flächen statt feiner Rahmen */
:root{--feld:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--feld:var(--sc-high)}}
:root[data-theme="dark"]{--feld:var(--sc-high)}
@media all{
  .tf input,.tf select,.tf textarea{background:var(--feld)!important;box-shadow:none!important;border-radius:14px!important;padding:24px 16px 8px}
  .tf textarea{padding-top:26px}
  .tf input:focus,.tf select:focus,.tf textarea:focus{box-shadow:inset 0 0 0 2px var(--primary)!important}
  .tf label{background:transparent!important;left:14px;top:16px}
  .tf :focus + label,.tf input:not(:placeholder-shown) + label,.tf textarea:not(:placeholder-shown) + label,.tf.fl label{top:6px!important;font-size:12px;line-height:16px}
  .tf input::placeholder,.tf textarea::placeholder{opacity:.75}
  .mrow .tf input,.mrow .tf select{padding:12px!important;padding-right:42px!important;height:48px}
  .mrow .tf select{padding-right:36px!important}
  .mrow[data-state="ok"] .tf input,.mrow[data-state="ok"] .tf select{background:color-mix(in srgb,var(--ok-c) 70%,var(--feld))!important;box-shadow:none!important}
  .mrow[data-state="bad"] .tf input,.mrow[data-state="bad"] .tf select{background:var(--err-c)!important;color:var(--on-err-c);box-shadow:none!important}
  .seg{border:0!important;background:var(--feld);padding:3px;border-radius:22px!important;gap:2px;overflow:visible}
  .seg button{border:0!important;border-radius:19px!important;min-height:38px}
  .chip{border:0!important;background:var(--feld);border-radius:12px;min-height:36px;color:var(--on-surface)}
  .chip[aria-pressed="true"]{background:var(--sec-c)}
  .foto.leer,.foto:not(:has(img)){border:0!important;background:var(--feld)!important;border-radius:20px!important}
  .spick{border:0!important;border-radius:22px!important;background:var(--sc-high)!important;padding:0 12px 0 16px}
  .spick:hover,.spick:active{background:var(--sc-highest)!important}
  .spick:has(.sd.bad){background:var(--err-c)!important;color:var(--on-err-c)}
}

/* iPad/PC: ohne Häkchen und Fokusrahmen, gleitende Umschalter */
@media all{
  .seg button .ic,.chip .ic{display:none!important}
  .chip[aria-pressed="true"]{padding-left:16px!important}
  .tf input:focus,.tf select:focus,.tf textarea:focus{box-shadow:none!important;outline:none!important;background:color-mix(in srgb,var(--primary) 9%,var(--feld))!important}
  .seg{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
  .seg.hat-ind button{background:transparent!important;position:relative;z-index:1;transition:color .2s}
  .seg.hat-ind button[aria-pressed="true"]{color:var(--on-sec-c)}
  .seg-ind{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:19px;background:var(--sec-c);z-index:0;pointer-events:none;opacity:0;transition:translate .32s cubic-bezier(.32,.72,0,1),width .32s cubic-bezier(.32,.72,0,1),background .2s,scale .2s}
  .seg.zieht .seg-ind{transition:width .2s,background .2s,scale .2s;scale:1.03}
  .seg.ev .seg-ind[data-v="ok"]{background:var(--ok-c)}.seg.ev .seg-ind[data-v="nok"]{background:var(--err-c)}
  .seg.ev.hat-ind button[aria-pressed="true"][data-v="ok"]{color:var(--on-ok-c)}.seg.ev.hat-ind button[aria-pressed="true"][data-v="nok"]{color:var(--on-err-c)}
  .kat-wahl select{position:absolute!important;inset:0;opacity:0;pointer-events:none}
  .kat-feld{display:block;width:100%;height:56px;border:0;border-radius:14px;background:var(--feld);color:var(--on-surface);text-align:left;padding:24px 44px 8px 16px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kat-feld:active{background:color-mix(in srgb,var(--primary) 9%,var(--feld))}
  .dlg:has(.kp){width:min(640px,calc(100% - 48px));padding:20px 20px 16px}
  .kp-s{margin:0 0 8px!important}
  .kp-l{max-height:min(60vh,560px);overflow:auto;margin:0 -4px;padding:0 4px}
  .kp-l .sec-lbl:first-child{margin-top:8px}
  .kp-i{width:100%}
  .kp-i.an{background:color-mix(in srgb,var(--primary) 12%,var(--sc))!important}
  .kp-i > .ic:last-child{color:var(--primary);opacity:1;width:22px;height:22px}
  .av.av-img{background:#fff;overflow:hidden}.av.av-img img{width:100%;height:100%;object-fit:contain}
}

  :root body nav.navbar .nav-head{display:flex!important;align-items:center;height:56px;margin:0 0 14px;padding:0 14px;justify-content:flex-start}

  :root body nav.navbar .nav-head .nav-logo{height:26px;width:auto}
  :root body nav.navbar .nav-head .nav-logo.l-hell{display:block!important}
  :root body nav.navbar .nav-head .nav-logo.l-dunkel{display:none!important}
  :root body nav.navbar .nav-item{flex:none!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center!important;gap:14px!important;height:52px!important;margin:0!important;padding:0 18px!important;border-radius:26px!important;font-size:15px!important;font-weight:650;color:var(--on-sv)!important;background:transparent!important;box-shadow:none!important}

}
@media (min-width:1024px) and (hover:hover) and (pointer:fine) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) body nav.navbar .nav-head .nav-logo.l-hell{display:none!important}:root:not([data-theme="light"]) body nav.navbar .nav-head .nav-logo.l-dunkel{display:block!important}:root:not([data-theme="light"]) body nav.navbar .nav-item[aria-current="page"]{background:var(--sec-c)!important;color:var(--on-sec-c)!important}}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){:root[data-theme="dark"] body nav.navbar .nav-head .nav-logo.l-hell{display:none!important}:root[data-theme="dark"] body nav.navbar .nav-head .nav-logo.l-dunkel{display:block!important}:root[data-theme="dark"] body nav.navbar .nav-item[aria-current="page"]{background:var(--sec-c)!important;color:var(--on-sec-c)!important}}

.tl-p{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;border:0;border-radius:16px;background:var(--feld);color:var(--on-surface);font-size:15px;font-weight:650;text-align:left;-webkit-tap-highlight-color:transparent;transition:background .15s,transform .12s}

<script>
(() => {
"use strict";
try{ if(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone) document.documentElement.classList.add("standalone"); }catch(e){}
const GROUPS = [
  {id:"frei", ps:"Helfer: LS aus", t:"Spannungsfrei", sub:"Helfer schaltet den LS der Ladestation aus", how:[
    "Spannungsfreiheit feststellen, FEV300 in die Ladedose stecken.",
    "Schutzleiter: MFT auf R<sub>LO</sub>, Prüfspitze an eine blanke Gehäuseschraube, zweite Leitung an die PE-Buchse des FEV300.",
    "Isolation: Erstprüfung an der Zuleitung vor dem Anklemmen, Wiederholungsprüfung im Verteiler – L1+L2+L3+N gebrückt gegen PE. Mit Überspannungsschutz 250 V, sonst 500 V."], rows:[
    {k:"rpe", l:"Schutzleiter", d:"Gehäuseschraube ↔ PE-Buchse FEV300", u:"Ω", soll:"≤ 0,3 Ω", t:v=>v<=0.3},
    {k:"riso", l:"Isolation", d:"L1+L2+L3+N gebrückt gegen PE", u:"MΩ", soll:"≥ 1 MΩ", t:v=>v>=1},
    {k:"risov", l:"Prüfspannung Isolation", type:"sel", pre:true, opts:["500 V","250 V"], soll:"250 V bei Überspannungsschutz", psoll:"500 V (250 V mit SPD)"},
  ]},
  {id:"spann", ps:"FEV300 auf CP = C", t:"Unter Spannung", sub:"Helfer schaltet den LS wieder ein, FEV300 auf CP = C", how:[
    "PE-Vortest: Finger auf die Touch-Fläche des FEV300 – keine Warnanzeige.",
    "CP-Schalter A → B → C: Die Wallbox schaltet in C zu (LED/Schütz).",
    "Spannungen und Drehfeld an den Buchsen des FEV300 messen.",
    "Schleifenimpedanz Zs je Außenleiter gegen PE im Modus „std. RCD“ – der RCD löst dabei nicht aus."], rows:[
    {k:"pevt", l:"PE-Vortest (Touch)", type:"chk", soll:"keine Warnanzeige"},
    {k:"cp", l:"CP A → B → C", type:"chk", soll:"Box schaltet zu, LEDs an"},
    {k:"u1", l:"Spannung L1 – N", u:"V", soll:"207 – 253 V", t:v=>v>=207&&v<=253},
    {k:"u2", l:"Spannung L2 – N", u:"V", soll:"207 – 253 V", t:v=>v>=207&&v<=253, p3:true},
    {k:"u3", l:"Spannung L3 – N", u:"V", soll:"207 – 253 V", t:v=>v>=207&&v<=253, p3:true},
    {k:"unpe", l:"Spannung N – PE", u:"V", soll:"≈ 0 V (Richtwert < 10 V)", t:v=>v<10},
    {k:"dreh", l:"Drehfeld", type:"sel", opts:["rechts (123)","links (321)"], soll:"rechts", t:v=>v.startsWith("rechts"), p3:true},
    {k:"zs1", l:"Zs L1 – PE", d:"Mode std. RCD", u:"Ω", zs:true},
    {k:"zs2", l:"Zs L2 – PE", u:"Ω", zs:true, p3:true},
    {k:"zs3", l:"Zs L3 – PE", u:"Ω", zs:true, p3:true},
  ]},
  {id:"rcd", ps:"CP = C", t:"RCD / DC-Fehlerstrom", sub:"CP = C, Helfer schaltet den RCD nach jeder Auslösung wieder ein", how:[
    "MFT auf RCD, Mode „current“ (Rampe), RCD-Typ einstellen. Eine Messung zeigt Auslösestrom IΔ, Berührungsspannung UB und Auslösezeit t.",
    "6 mA DC: nur bei DC-Erkennung in der Wallbox bzw. RCD Typ A-EV – die Ladung muss abbrechen.",
    "Die Einzelmessungen bei ½ × und 5 × IΔn sind optional (z. B. AUTO-Modus des MFT)."], rows:[
    {k:"ria", l:"Auslösestrom IΔ", d:"Rampe", u:"mA", ria:true},
    {k:"ub", l:"Berührungsspannung UB", u:"V", soll:"≤ 50 V", t:v=>v<=50},
    {k:"r1", l:"Auslösezeit t", d:"bei der Rampe mit angezeigt", u:"ms", soll:"≤ 300 ms", t:v=>v<=300},
    {k:"dc6", l:"6 mA DC (EVSE)", d:"Ladung bricht ab", u:"s", soll:"≤ 10 s", t:v=>v<=10, dc:true},
    {k:"r05", l:"½ × IΔn", type:"chk", soll:"keine Auslösung", opt:true},
    {k:"r5", l:"5 × IΔn Auslösezeit", u:"ms", soll:"≤ 40 ms", t:v=>v<=40, opt:true},
  ]},
  {id:"fkt", ps:"am FEV300", t:"Funktion / Fehlersimulation", sub:"am FEV300, Wallbox lädt (CP = C)", how:[
    "Taste E (CP-Fehler gegen PE) drücken: Die Wallbox muss die Ladung abbrechen.",
    "Taste F (PE-Unterbrechung): Die Ladung muss ebenfalls abbrechen."], rows:[
    {k:"fe", l:"Taste E (CP – PE)", type:"chk", soll:"Ladung bricht ab"},
    {k:"ff", l:"Taste F (PE unterbrochen)", type:"chk", soll:"Ladung bricht ab"},
  ]},
];
const ROWS = GROUPS.flatMap(g=>g.rows);
const SICHT=[
  {k:"gehaeuse",l:"Gehäuse, Abdeckungen und Display unbeschädigt"},
  {k:"ladekabel",l:"Ladekabel, Stecker bzw. Ladedose unbeschädigt",d:"Isolierung, Knickschutz, Kontakte, Halterung"},
  {k:"befestigung",l:"Befestigung bzw. Standsicherheit",d:"Wallbox fest montiert, Säule standsicher, Anfahrschutz falls nötig"},
  {k:"umgebung",l:"Montageort und Schutzart passend",d:"IP-Schutzart, Witterung, keine Feuchte im Anschlussraum"},
  {k:"leitung",l:"Zuleitung fachgerecht",d:"Auswahl, Verlegung, Einführung, Zugentlastung"},
  {k:"klemmen",l:"Anschlussraum: Klemmstellen fest, keine Verfärbung"},
  {k:"schutz",l:"Schutzeinrichtungen passend zur Ladestation",d:"LS, RCD-Typ und DC-Erkennung lt. Herstellerangabe"},
  {k:"kennz",l:"Stromkreis im Verteiler gekennzeichnet",d:"eigener Stromkreis je Ladepunkt"},
  {k:"schild",l:"Typschild lesbar, Herstellerunterlagen vorhanden"},
];
function sichtResult(s){ if(!s.sicht) return "ok"; const v=SICHT.map(r=>s.sicht[r.k]); return v.includes("nok")?"bad":v.every(x=>x==="ok")?"ok":"open"; }
function sichtState(s){ if(!s.sicht) return "ok"; const v=SICHT.map(r=>s.sicht[r.k]); if(v.includes("nok")) return "bad"; if(v.every(x=>x==="ok")) return "ok"; return v.some(x=>x==="ok")?"wip":"open"; }
const RCD_TYPES = ["A + RDC-DD 6 mA","A-EV","B","A (ohne DC-Erkennung)"];
const PRUEFARTEN = ["Erstprüfung","Erweiterung","Wiederholungsprüfung","nach Instandsetzung"];
const NORMEN = ["DIN VDE 0100-600","DIN VDE 0105-100","DIN VDE 0100-722","DGUV V3"];
const DEF_UMFANG = "Stromkreise der Ladeeinrichtungen ab Verteiler [Name] inkl. aller Ladepunkte. Prüfung nach DIN VDE 0100-722 mit Prüfadapter Fluke FEV300. Übrige elektrische Anlage nicht Bestandteil dieser Prüfung.";
const defFunktion = ad=>`Funktionsprüfung mit Prüfadapter ${ad||"Fluke FEV300"} durchgeführt. PE-Vortest ohne Befund. CP-Zustände A, B, C durchgeschaltet, Ladefreigabe in Zustand C erfolgt. Fehlersimulation CP-Fehler (E) und PE-Unterbrechung (F): Ladevorgang wurde jeweils abgebrochen.`;
const DEF_FUNKTION = defFunktion("Fluke FEV300");
const RES_TXT = {ok:"bestanden", bad:"nicht bestanden", open:"offen", wip:"in Arbeit"};
const RES_SHORT = {ok:"i.O.", bad:"n.i.O.", open:"offen", wip:"in Arbeit"};

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = s=>{ if(s==null) return NaN; const m=String(s).replace(",",".").replace(/[^0-9.\-]/g,""); return m===""?NaN:parseFloat(m); };
const fmt = (v,d=3)=>Number(v).toLocaleString("de-DE",{maximumFractionDigits:d});
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = ()=>new Date().toISOString().slice(0,10);
const deDate = iso=>iso?iso.split("-").reverse().join("."):"";

function newLP(){ return {v:{risov:"500 V"}, bem:""}; }
function newSaeule(n,bauart="Wallbox"){ return {id:uid(), sicht:{}, bauart, name:`${bauart} ${n}`, typ:"", sn:"", ort:"", fw:"", absTyp:"LS B", absIn:"16", zsMan:"", inenn:"", rcd:RCD_TYPES[0], idn:"30", freigabe:"", phasen:3, lps:bauart==="Ladesäule"?2:1, lp:[newLP(),newLP()], fotos:{}}; }
const BAUART=s=>s.bauart||"Ladesäule";
const BAUARTEN=[["Wallbox","Wallbox","an der Wand"],["Ladesäule","Ladesäule","freistehend"]];
function newProto(){
  return {id:uid(), kundeId:null, standortId:null, ladeparkId:null,
    p:{projekt:"", auftraggeber:"", auftragsnr:"", standort:"", datum:today(), pruefer:"", geraet:"Wiha MFT one", geraetSn:"", kal:"", adapter:"Fluke FEV300", art:"Erstprüfung", normen:["DIN VDE 0100-600","DIN VDE 0100-722"], netz:"TN-C-S", umfang:DEF_UMFANG},
    s:[newSaeule(1)], a:{maengel:"", funktion:DEF_FUNKTION, naechste:"", sigP:"", sigK:"", sigPName:"", sigKName:""}};
}
function zsInfo(s){
  const In=num(s.absIn);
  if((s.absTyp==="LS B"||s.absTyp==="LS C")&&In>0){
    const f=s.absTyp==="LS B"?5:10, Ia=f*In, z=230/Ia, z23=z*2/3, r=Math.round(z23*100)/100;
    return {zul:r, calc:`${s.absTyp}${fmt(In)}: Ia = ${f} · ${fmt(In)} A = ${fmt(Ia)} A → 230 V / ${fmt(Ia)} A = ${fmt(z,6)} Ω → · 2/3 = ${fmt(z23,6)} Ω → ${fmt(r,2)} Ω`};
  }
  const m=num(s.zsMan);
  return {zul:isNaN(m)?NaN:m, calc:s.absTyp==="manuell"?"Zs zulässig aus der Sicherungstabelle eintragen.":"Nennstrom des LS eintragen."};
}
function sollOf(r,s){
  if(r.zs){ const z=zsInfo(s).zul; return isNaN(z)?"Zs zulässig fehlt":`≤ ${fmt(z,2)} Ω`; }
  if(r.ria){ const i=num(s.idn)||30; return `${fmt(0.5*i)} – ${fmt(i)} mA`; }
  return r.soll||"";
}
const RCD_TYPEN=["A","A-EV","F","B"];
function rcdInfo(s){ const r=String(s.rcd||""), t=s.rcdTyp||(/^B/.test(r)?"B":/A-EV/.test(r)?"A-EV":/^F/.test(r)?"F":"A"); return {t, dc:(t==="A"||t==="F")&&(s.rdc!==undefined?!!s.rdc:/RDC-DD/.test(r))}; }
function setRcd(s,t,dc){ if(t==="B"||t==="A-EV") dc=false; s.rcdTyp=t; s.rdc=dc; s.rcd=`${t}${dc?" + RDC-DD 6 mA":""}`; }
const polLS=s=>s.phasen===3?"3-polig":"1-polig", polRCD=s=>s.phasen===3?"4-polig":"2-polig";
function rowVisible(r,s){ if(r.p3&&s.phasen===1) return false; if(r.dc){ const i=rcdInfo(s); if(!i.dc&&i.t!=="A-EV") return false; } return true; }
function evalRow(r,val,s){
  if(val==null||val==="") return r.opt?"skip":"open";
  if(r.type==="chk") return val==="ok"?"ok":val==="nok"?"bad":"open";
  if(r.type==="sel") return r.t?(r.t(val)?"ok":"bad"):"ok";
  const v=num(val); if(isNaN(v)) return "open";
  if(r.zs){ const z=zsInfo(s).zul; if(isNaN(z)) return "open"; return v<=z?"ok":"bad"; }
  if(r.ria){ const i=num(s.idn)||30; return (v>=0.5*i&&v<=i)?"ok":"bad"; }
  return r.t(v)?"ok":"bad";
}
function groupResult(g,s,li){ let o=0,b=0; for(const r of g.rows){ if(!rowVisible(r,s)) continue; const e=evalRow(r,s.lp[li].v[r.k],s); if(e==="bad")b++; else if(e==="open")o++; } return b?"bad":o?"open":"ok"; }
function lpResult(s,li){ const rs=GROUPS.map(g=>groupResult(g,s,li)); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }
function saeuleResult(s){ const rs=[sichtResult(s)]; for(let i=0;i<s.lps;i++) rs.push(lpResult(s,i)); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }
function stateOf(list){ if(list.includes("bad")) return "bad"; if(list.every(x=>x==="ok"||x==="skip")) return "ok"; return list.some(x=>x==="ok"||x==="wip")?"wip":"open"; }
function groupState(g,s,li){
  const rs=g.rows.filter(r=>rowVisible(r,s)).map(r=>[r,evalRow(r,s.lp[li].v[r.k],s)]).filter(x=>x[1]!=="skip"), es=rs.map(x=>x[1]);
  if(es.includes("bad")) return "bad"; if(es.every(e=>e==="ok")) return "ok";
  return rs.some(([r,e])=>!r.pre&&e!=="open")?"wip":"open"; }
function lpState(s,li){ const st=GROUPS.map(g=>groupState(g,s,li)); return stateOf(st); }
function saeuleState(s){ return stateOf([sichtState(s),...Array.from({length:s.lps},(_,i)=>lpState(s,i))]); }
const imUmfang=(p,s)=>!((p.a&&p.a.pdfOhne)||[]).includes(s.id);
const umfangS=p=>{ const L=p.s.filter(s=>imUmfang(p,s)); return L.length?L:p.s; };
const fertigS=s=>{ const st=saeuleState(s); return st==="ok"||st==="bad"; };
function protoState(p){ return stateOf(umfangS(p).map(saeuleState)); }
function protoResult(p){ const rs=umfangS(p).map(saeuleResult); return rs.includes("bad")?"bad":rs.includes("open")?"open":"ok"; }

const CONFIG=Object.assign({
  tenantId:"",
  clientId:"",
  shareUrl:"",
  admins:[],
  dataFolder:"_App-Daten",
}, window.__EVSE_CONFIG__||{});
const SYNC_ON=!!(CONFIG.tenantId&&CONFIG.clientId&&CONFIG.shareUrl);

const TH_KEY="evse_theme", OLD_KEY="evse_protos_v1";
const KINDS=["kunden","standorte","ladeparks","pruefungen","katalog"];
const DB={kunden:new Map(),standorte:new Map(),ladeparks:new Map(),pruefungen:new Map(),katalog:new Map()};
let META={profil:{name:""},pins:[],archiv:[],filter:"alle",sync:{}};
let cur=null, nav={v:"start"}, saveTimer=null, dirtyCur=false, dataDB=null, query="";
let ME={name:"",mail:"",admin:false,signedIn:false};

function idbReq(rq){ return new Promise((res,rej)=>{ rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
function openStores(name,stores,meta){ return new Promise((res,rej)=>{
  if(!window.indexedDB) return rej(0);
  const anlegen=db=>{ stores.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:"id"}); }); if(meta&&!db.objectStoreNames.contains("meta")) db.createObjectStore("meta"); };
  const r=indexedDB.open(name);
  r.onupgradeneeded=()=>anlegen(r.result);
  r.onsuccess=()=>{ const db=r.result, fehlt=stores.some(s=>!db.objectStoreNames.contains(s))||(meta&&!db.objectStoreNames.contains("meta"));
    if(!fehlt){ db.onversionchange=()=>db.close(); return res(db); }
    const v=db.version+1; db.close(); const r2=indexedDB.open(name,v);
    r2.onupgradeneeded=()=>anlegen(r2.result); r2.onsuccess=()=>{ r2.result.onversionchange=()=>r2.result.close(); res(r2.result); }; r2.onerror=()=>rej(r2.error); };
  r.onerror=()=>rej(r.error); }); }
function dataOpen(){ return openStores("evse_daten",KINDS,true); }
let warned=false;
function dbPut(kind,rec){ if(kind==="pruefungen") try{ rec.zst=protoState(rec); }catch(e){} DB[kind].set(rec.id,rec); if(!dataDB) return;
  try{ const t=dataDB.transaction(kind,"readwrite"); t.objectStore(kind).put(rec); t.onerror=t.onabort=storageWarn; }catch(e){ storageWarn(); } }
function dbDelHard(kind,id){ DB[kind].delete(id); if(dataDB) try{ dataDB.transaction(kind,"readwrite").objectStore(kind).delete(id); }catch(e){} }
function metaSave(){ if(dataDB) try{ dataDB.transaction("meta","readwrite").objectStore("meta").put(META,"meta"); }catch(e){} }
function storageWarn(){ if(!warned){ warned=true; toast("Speichern auf dem Gerät fehlgeschlagen – bitte „Alle sichern“"); } }
async function dataLoad(){
  try{ dataDB=await dataOpen();
    for(const k of KINDS){ (await idbReq(dataDB.transaction(k).objectStore(k).getAll())).forEach(r=>DB[k].set(r.id,r)); }
    const m=await idbReq(dataDB.transaction("meta").objectStore("meta").get("meta")); if(m) META=Object.assign(META,m);
  }catch(e){ dataDB=null; toast("Gerätespeicher nicht verfügbar – Daten nur bis zum Schließen"); }
  if(!META.migriert){ let old=null; try{ old=JSON.parse(localStorage.getItem(OLD_KEY)||"null"); }catch(e){}
    if(Array.isArray(old)&&old.length) importLegacy(old); META.migriert=true; metaSave(); }
  for(const p of [...DB.pruefungen.values()]) if(!p.zst) dbPut("pruefungen",p);
  if((META.katSeed||0)<KAT_STAND){ katSeed(); META.katSeed=KAT_STAND; metaSave(); }
}
const live=k=>[...DB[k].values()].filter(r=>!r.deleted);
const who=()=>({name:ME.name||META.profil.name||"",mail:ME.mail||""});
function stamp(rec,isNew){ const t=Date.now(), w=who(); if(isNew||!rec.created){ rec.created=t; rec.createdBy=w; } rec.updated=t; rec.updatedBy=w; if(!rec.demo) rec._dirty=true; }
function saveRec(kind,rec,isNew){ stamp(rec,isNew); dbPut(kind,rec); syncSoon(); return rec; }
function scheduleSave(){ if(!cur||!canEdit(cur)) return; dirtyCur=true; setSub("Ungespeichert …"); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,900); }
function commit(){ dirtyCur=true; saveNow(); }
function saveNow(){
  if(!cur) return; clearTimeout(saveTimer); if(!dirtyCur||!canEdit(cur)) return; dirtyCur=false;
  const c=JSON.parse(JSON.stringify(cur)), old=DB.pruefungen.get(c.id); if(old){ c._etag=old._etag; c._itemId=old._itemId; }
  stamp(c,false); cur.updated=c.updated; cur.updatedBy=c.updatedBy; dbPut("pruefungen",c); try{ zurueckAnOrt(c); }catch(e){}
  setSub(SYNC_ON?"Gespeichert · wird abgeglichen":"Gespeichert auf diesem Gerät"); syncSoon();
}
let saveTxt="Gespeichert auf diesem Gerät";
function setSub(t){ saveTxt=t; const e=$("#saveState"); if(e) e.textContent=t; }
function toast(t,action,fn){ const el=$("#toast"); el.innerHTML=`<span>${esc(t)}</span>${action?`<button type="button">${esc(action)}</button>`:""}`; el.hidden=false;
  if(action) el.querySelector("button").onclick=()=>{ el.hidden=true; fn(); };
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,action?6000:2800); }

const sameUser=(a,b)=>!!(a&&b&&a.mail&&b.mail&&a.mail.toLowerCase()===b.mail.toLowerCase());
function canEdit(rec){ if(!rec) return false; if(!SYNC_ON||rec.demo) return true; if(!ME.signedIn) return false;
  return ME.admin||!rec.createdBy||!rec.createdBy.mail||sameUser(rec.createdBy,ME); }

const kundeOf=id=>DB.kunden.get(id), standortOf=id=>DB.standorte.get(id), ladeparkOf=id=>id?DB.ladeparks.get(id):null;
function pfad(p){ return {k:kundeOf(p.kundeId), s:standortOf(p.standortId), l:ladeparkOf(p.ladeparkId)}; }

async function katImport(el){
  const f=el.files[0]; el.value=""; if(!f) return;
  try{ const d=JSON.parse(await new Response(f).text()); if(!d||d.app!=="evse-katalog"||!Array.isArray(d.katalog)) throw 0;
    let neu=0, akt=0;
    for(const r of d.katalog){ if(!r||!r.id) continue; const loc=DB.katalog.get(r.id);
      if(!loc){ r._dirty=true; dbPut("katalog",r); neu++; continue; }
      const hs=new Map((loc.hinweise||[]).map(h=>[h.id,h])); (r.hinweise||[]).forEach(h=>{ if(!hs.has(h.id)) hs.set(h.id,h); });
      const inhalt=x=>JSON.stringify(Object.keys(x).filter(k=>!/^(_|created|updated|hinweise$|anhaenge$|bild$)/.test(k)).sort().map(k=>[k,x[k]]));
      const neuer=(r.updated||0)>(loc.updated||0)&&inhalt(r)!==inhalt(loc), m=neuer?Object.assign({},loc,r,{anhaenge:loc.anhaenge,bild:loc.bild}):Object.assign({},loc);
      const vorher=(loc.hinweise||[]).length; m.hinweise=[...hs.values()];
      if(neuer||m.hinweise.length!==vorher){ m._etag=loc._etag; m._itemId=loc._itemId; m._dirty=true; dbPut("katalog",m); akt++; } }
    if(d.fotos) for(const [k,v] of Object.entries(d.fotos)) if(!fotoCache.has(k)){ await fotoPut(k,v); fotoQueue(k); }
    syncSoon(); render(); toast(`Katalog geladen: ${neu} neu, ${akt} ergänzt`);
  }catch(e){ toast("Die Datei ist keine Katalog-Datei"); }
}

function dateiOpen(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(0); const r=indexedDB.open("evse_dateien",1); r.onupgradeneeded=()=>r.result.createObjectStore("d"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

function dateiPut(id,o){ return new Promise(res=>{ if(!dateiDB) return res(false); try{ const t=dateiDB.transaction("d","readwrite"); t.objectStore("d").put(o,id); t.oncomplete=()=>{ DATEI_DA.add(id); res(true); }; t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } }); }

const snNorm=v=>String(v||"").replace(/[\s\-./]/g,"").toUpperCase();
function snDoppelt(p,si){ const n=snNorm(p.s[si].sn); if(!n) return []; return p.s.map((x,i)=>i!==si&&snNorm(x.sn)===n?sName(x,i):null).filter(Boolean); }
const snWarnHtml=(p,si)=>{ const d=snDoppelt(p,si); return d.length?`<p class="warnline">${icon("warn")}Seriennummer kommt auch bei ${esc(d.join(", "))} vor.</p>`:""; };
function kalBis(t){ t=String(t||"").trim(); let m;
  if((m=t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) return new Date(+m[3],+m[2]-1,+m[1]);
  if((m=t.match(/^(\d{1,2})[./](\d{4})$/))) return new Date(+m[2],+m[1],0);
  if((m=t.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/))) return m[3]?new Date(+m[1],+m[2]-1,+m[3]):new Date(+m[1],+m[2],0);
  return null; }
function kalStatus(p){ const raw=p.p.kal; if(!raw) return {s:"leer",t:"Kalibrierdatum des Messgeräts nicht eingetragen."};
  const bis=kalBis(raw); if(!bis) return {s:"form",t:"Kalibrierdatum nicht erkannt – bitte als MM.JJJJ eintragen."};
  const tag=new Date((p.p.datum||today())+"T12:00:00"), rest=Math.floor((bis-tag)/864e5);
  if(rest<0) return {s:"ab",t:`Kalibrierung abgelaufen (gültig bis ${raw}) – Messungen damit sind nicht nachweissicher.`};
  if(rest<=30) return {s:"bald",t:`Kalibrierung läuft in ${rest} Tag${rest===1?"":"en"} ab – Gerät rechtzeitig einschicken.`};
  return {s:"ok",t:""}; }
const kalWarnHtml=p=>{ const k=kalStatus(p); return k.s==="ok"||k.s==="leer"?"":`<p class="warnline${k.s==="bald"?" mild":""}">${icon("warn")}${esc(k.t)}</p>`; };
function pdfPruefung(p){
  const out=[], ohne=p.a.pdfOhne||[], S=p.s.map((s,i)=>({s,i})).filter(x=>!ohne.includes(x.s.id));
  const offen=[]; let bad=false;
  S.forEach(({s,i})=>{ for(let l=0;l<s.lps;l++){ const st=lpState(s,l); if(st==="bad") bad=true; if(st==="open"||st==="wip") offen.push(`${sName(s,i)}${s.lps>1?` Ladepunkt ${l+1}`:""}`); } });
  if(offen.length) out.push(`Noch nicht alle Werte erfasst: ${offen.slice(0,4).join(", ")}${offen.length>4?` und ${offen.length-4} weitere`:""}.`);
  if(bad&&!String(p.a.maengel||"").trim()) out.push("Nicht bestanden, aber keine Mängel / Maßnahmen eingetragen.");
  const dop=[]; S.forEach(({s,i})=>{ const d=snDoppelt(p,i); if(d.length&&!dop.some(x=>x.includes(sName(s,i)))) dop.push([sName(s,i),...d].join(" = ")); });
  if(dop.length) out.push(`Doppelte Seriennummer: ${dop.join("; ")}.`);
  const fehltSn=S.filter(({s})=>!String(s.sn||"").trim()).length; if(fehltSn) out.push(`Seriennummer fehlt bei ${fehltSn} Station${fehltSn>1?"en":""}.`);
  const k=kalStatus(p); if(k.s!=="ok") out.push(k.t);
  if(!p.a.sigP) out.push("Unterschrift Prüfer fehlt.");
  if(!p.a.sigK&&!p.a.kAbwesend) out.push("Unterschrift Auftraggeber fehlt (oder „nicht anwesend“ wählen).");
  if(!p.a.naechste) out.push("Nächste Prüfung nicht festgelegt.");
  return out;
}
