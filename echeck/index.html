:root{
  --primary:#C8102E; --on-primary:#FFFFFF; --pc:#FFDAD8; --on-pc:#410006; --brand:#E11D2F;
  --sec-c:#F3DDDC; --on-sec-c:#2C1514;
  --surface:#FCFCFD; --sc-low:#F5F5F7; --sc:#EFF0F3; --sc-high:#E8E9ED; --sc-highest:#E1E2E7;
  --on-surface:#1F1F22; --on-sv:#4A4D55; --outline:#7A7D85; --outline-v:#C9CBD1;
  --wip:#E0A100; --wip-c:#FFEDB8; --on-wip-c:#4A3400;
  --ok:#1B7F45; --ok-c:#D3F0DD; --on-ok-c:#0B3A1E; --err:#BA1A1A; --err-c:#FFDAD6; --on-err-c:#410002;
  --fab:#E11D2F; --on-fab:#FFFFFF; --scrim:rgba(0,0,0,.32);
  --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15); --e3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --on-surface:#E5E5E7; --on-sv:#C1C3C9; --outline:#8C8F96; --outline-v:#44464C;
  --wip:#F2C14E; --wip-c:#4A3A10; --on-wip-c:#FFE7A8;
  --ok:#7FD79E; --ok-c:#10391F; --on-ok-c:#B6F2C9; --err:#FFB4AB; --err-c:#93000A; --on-err-c:#FFDAD6;
  --fab:#C8102E; --on-fab:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#FFB3AE; --on-primary:#68000F; --pc:#930019; --on-pc:#FFDAD8; --sec-c:#5C3F3D; --on-sec-c:#FFDAD8;
  --surface:#131314; --sc-low:#1B1B1D; --sc:#1F1F21; --sc-high:#2A2A2C; --sc-highest:#353537;
  --on-surface:#E5E5E7; --on-sv:#C1C3C9; --outline:#8C8F96; --outline-v:#44464C;
  --wip:#F2C14E; --wip-c:#4A3A10; --on-wip-c:#FFE7A8;
  --ok:#7FD79E; --ok-c:#10391F; --on-ok-c:#B6F2C9; --err:#FFB4AB; --err-c:#93000A; --on-err-c:#FFDAD6;
  --fab:#C8102E; --on-fab:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);padding-top:env(safe-area-inset-top,0px);transition:background .2s}
.topbar.scrolled{background:var(--surface);box-shadow:0 1px 0 var(--outline-v)}
.tb-row{display:flex;align-items:center;gap:4px;height:64px;padding:0 max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px))}
.tb-title{flex:1;min-width:0;margin:0 0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--on-sv);display:grid;place-items:center;flex:none;position:relative}
.icon-btn:hover,.icon-btn:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.logo{height:26px;width:auto;margin-left:12px;display:none}
body.is-list .logo.l-hell{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.is-list .logo.l-hell{display:none}:root:not([data-theme="light"]) body.is-list .logo.l-dunkel{display:block}}
:root[data-theme="dark"] body.is-list .logo.l-hell{display:none}
:root[data-theme="dark"] body.is-list .logo.l-dunkel{display:block}
body.is-list .tb-title{visibility:hidden}
.tabs{display:flex;border-bottom:1px solid var(--outline-v);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;max-width:200px;height:48px;border:0;background:transparent;color:var(--on-sv);font-weight:600;font-size:14px;display:flex;justify-content:center;position:relative}
.tab .tl{display:flex;align-items:center;gap:6px;height:100%;position:relative;white-space:nowrap}
.tab{flex:1 0 auto;padding:0 12px}
.tab[aria-selected="true"]{color:var(--primary)}
.tab[aria-selected="true"] .tl::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--outline-v);display:inline-block}
.sd.ok{background:var(--ok)} .sd.bad{background:var(--err)} .sd.wip{background:var(--wip)}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sc);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.nav-item{flex:1;height:80px;border:0;background:transparent;color:var(--on-sv);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;letter-spacing:.02em}
.nav-item .ind{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav-item{min-width:0}
.nav-item>span:last-child{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.nav-item .ind{width:52px}}
.nav-item[aria-current="page"]{color:var(--on-surface)}
.nav-item[aria-current="page"] .ind{background:var(--sec-c);color:var(--on-sec-c)}
@media (min-width:744px){
  .navbar{top:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 20px) env(safe-area-inset-left,0px);background:var(--sc);transition:width .2s}
  .nav-head{display:flex;align-items:center;gap:8px;height:56px;margin:0 0 20px;justify-content:center}
  .nav-tog{display:grid}
  .nav-head .nav-logo{display:none;height:24px;width:auto}
  .nav-item{flex:none;height:auto;padding:4px 0}
  .nav-item .ind{width:56px}
  .nav-item.nav-end{margin-top:auto}
  body.has-nav .topbar, body.has-nav main{margin-left:88px;transition:margin-left .2s}
  body.rail-open .navbar{width:232px;gap:4px}
  body.rail-open .nav-head{justify-content:flex-start;padding-left:16px}
  body.rail-open .nav-head .nav-logo.l-hell{display:block}
  body.rail-open .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;height:56px;margin:0 12px;padding:0 16px;border-radius:28px;font-size:14px}
  body.rail-open .nav-item .ind{width:24px;height:24px;background:transparent!important}
  body.rail-open .nav-item[aria-current="page"]{background:var(--sec-c);color:var(--on-sec-c)}
  body.rail-open .nav-item.nav-end{margin-top:auto}
  body.rail-open.has-nav .topbar, body.rail-open.has-nav main{margin-left:232px}
}
@media (max-width:743.98px){.nav-head{display:none}}
@media (min-width:744px){@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.rail-open .nav-head .nav-logo.l-hell{display:none}:root:not([data-theme="light"]) body.rail-open .nav-head .nav-logo.l-dunkel{display:block}}
:root[data-theme="dark"] body.rail-open .nav-head .nav-logo.l-hell{display:none}:root[data-theme="dark"] body.rail-open .nav-head .nav-logo.l-dunkel{display:block}}
main{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.has-nav main{padding-bottom:calc(184px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){main{padding-left:24px;padding-right:24px}}
@media (min-width:744px){body.has-nav main{padding-bottom:112px}}
.wrap{max-width:1040px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}
.narrow.lesen{max-width:760px}

/* Gemeinsam für alle Apps (tools/build.py setzt es ans Ende der Styles):
   Eingabefelder sind immer deutlich unterlegt – etwas dunkler als die Fläche darunter (hell) bzw. heller (dunkel).
   Dialoge bekommen dafür eine eigene, ruhige Fläche. Dazu eigene, schmale Scrollleisten am PC. */
:root{--feld:#DFE2E8;--dlg-bg:#FFFFFF;--feld-dlg:#DFE2E8;--feld-karte:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--feld:#2E2E31;--dlg-bg:#222225;--feld-dlg:#37373B;--feld-karte:#36363A}}
:root[data-theme="dark"]{--feld:#2E2E31;--dlg-bg:#222225;--feld-dlg:#37373B;--feld-karte:#36363A}

.card{--feld:var(--feld-karte)}
.dlg{background:var(--dlg-bg)!important;--feld:var(--feld-dlg)!important;--fbg:var(--dlg-bg)!important}
.tf input:hover:not(:focus):not(:disabled),.tf select:hover:not(:focus):not(:disabled),.tf textarea:hover:not(:focus):not(:disabled){background:color-mix(in srgb,var(--on-surface) 5%,var(--feld))!important}
/* breiter Dialog mit Feldern nebeneinander (z. B. Gerät) */
.dlg.breit{width:min(780px,calc(100% - 32px))}
.dlg .reihe3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dlg .reihe2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:599px){.dlg .reihe3,.dlg .reihe2{grid-template-columns:minmax(0,1fr)}}
/* Scrollleisten: schmal, abgerundet, nur sichtbar wo gescrollt wird */
@media (hover:hover) and (pointer:fine){

  ::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--on-surface) 22%,transparent);border:3px solid transparent;border-radius:12px;background-clip:padding-box;min-height:40px}
  ::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--on-surface) 40%,transparent)}

}
@supports not selector(::-webkit-scrollbar){html,.dlg{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--on-surface) 25%,transparent) transparent}}

.sk-zur.sk-zt{width:44px!important;height:44px!important;border-radius:50%!important;padding:0!important;display:grid!important;place-items:center;background:transparent!important;color:var(--on-surface)!important;margin:0 4px 0 -10px!important;flex:none;cursor:pointer;border:0}

.sk-zur.sk-zt:hover{background:color-mix(in srgb,var(--on-surface) 7%,transparent)!important}
.sk-zur.sk-zt:active{transform:scale(.92);background:color-mix(in srgb,var(--on-surface) 12%,transparent)!important}

.tip{position:fixed;z-index:200;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:280px;padding:7px 12px;border-radius:12px;background:var(--on-surface);color:var(--surface);font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s}

@media (min-width:1024px) and (hover:hover) and (pointer:fine){

/* PC: überall gleicher Abstand zwischen Seitenleiste und Inhalt/Titel – eine Inhaltsbreite für alle Bereiche,
   Platz für die Scrollleiste immer reserviert (sonst springt der Inhalt je nach Seitenlänge um ein paar Pixel) */
@media (min-width:1024px) and (hover:hover) and (pointer:fine){
  html{scrollbar-gutter:stable}
  /* mindestens 64 px Rand links und rechts – dort sitzt bei Unterseiten der Zurück-Pfeil, Titel und Inhalt bleiben bündig */
  /* Inhalt links bündig mit festem Abstand zur Seitenleiste (wie früher bei Statistik), nutzt die Breite nach rechts */
  main{padding-left:0!important;padding-right:0!important}

/* Schwebender Knopf: deutlicher Schatten, damit er über Listen sichtbar „schwebt“; am PC hebt er sich beim Drüberfahren leicht an */
.fab{box-shadow:0 6px 16px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.12)!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}

.fab:active{transform:translateY(0) scale(.97);box-shadow:0 3px 8px rgba(0,0,0,.18)!important}
/* Schweben (systemweit): alles, was über dem Inhalt liegt – Pop-ups, Menüs, Hinweise, Filter, schwebende Knöpfe – bekommt denselben weichen Schatten und blendet kurz ein */
:root{--schweben:0 10px 28px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.10);--schweben-dlg:0 22px 56px rgba(0,0,0,.24),0 4px 12px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--schweben:0 10px 28px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);--schweben-dlg:0 22px 56px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--schweben:0 10px 28px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);--schweben-dlg:0 22px 56px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.45)}
.ml-pop,.menu,.fpop,.snackbar,.fabm-it,.kd-ort,.wg-anp,.db-anp,#vlist{box-shadow:var(--schweben)!important}
.dlg{box-shadow:var(--schweben-dlg)!important}
.tip{box-shadow:var(--schweben)}
@keyframes schwebenEin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu:not([hidden]),.fpop{animation:schwebenEin .14s ease-out}

.kd-ort[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
/* Kartenhinweis (Pflicht-Quellenangabe) nur als kleines „i“ */
.kd-karte .maplibregl-ctrl-attrib.maplibregl-compact:not(.maplibregl-compact-show){padding:0}
.kt-box .sec-row{margin-top:20px}
@media (min-width:900px){.kt-liste{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.kt-liste{display:flex;flex-direction:column;gap:6px}
.kt-z{display:flex;align-items:center;gap:4px;background:var(--sc-low);border-radius:18px;padding:4px 6px 4px 4px}
.kt-haupt{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--on-surface);text-align:left;padding:8px 8px 8px 10px;border-radius:14px;font:inherit;cursor:pointer}
.kt-haupt:disabled{cursor:default;opacity:1}
@media (hover:hover){.kt-haupt:not(:disabled):hover{background:color-mix(in srgb,var(--on-surface) 5%,transparent)}}
.kt-av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--sec-c);color:var(--on-sec-c);font-size:13px;font-weight:700}
.kt-t{display:flex;flex-direction:column;min-width:0}
.kt-t b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt-t small{font-size:13px;color:var(--on-sv);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt-b{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--primary);background:transparent;text-decoration:none}
.kt-b:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.kt-b .ic{width:20px;height:20px}
.kt-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}

/* Fenster nie unter die Statusleiste (iOS-Web-App mit durchscheinender Leiste): Mitte und Höhe ohne die sicheren Ränder */
.dlg{top:calc(50% + (env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 2);max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
/* iPad und PC: Fenster breiter (mehr Platz für Text und Fotos) */
@media (min-width:744px){.dlg{width:min(680px,calc(100% - 64px))}.dlg.breit{width:min(960px,calc(100% - 64px))}}

</style>

const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const initials=n=>(n||"?").split(/[\s.@]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("")||"?";
function tf(path,label,val,o={}){
  const cls=["tf"]; if(o.full) cls.push("full"); if(o.ph||o.type==="date") cls.push("fl"); if(o.sfx) cls.push("has-sfx");
  const bind=o.form?`data-f="${esc(path)}"`:`data-bind="${esc(path)}"`, id=o.form?"f_"+path:path;
  return `<div class="${cls.join(" ")}"><input id="${esc(id)}" ${bind} ${o.list?`data-vl="${o.list}"`:""} type="${o.type||"text"}" ${o.im?`inputmode="${o.im}"`:""} value="${esc(val)}" placeholder="${esc(o.ph||" ")}" autocomplete="off"><label for="${esc(id)}">${esc(label)}</label>${o.sfx?`<span class="sfx">${esc(o.sfx)}</span>`:""}</div>`;
}
function ta(path,label,val,o={}){
  const bind=o.form?`data-f="${esc(path)}"`:`data-bind="${esc(path)}"`, id=o.form?"f_"+path:path;
  return `<div class="tf${o.ph?" fl":""}${o.full?" full":""}"><textarea id="${esc(id)}" ${bind} placeholder="${esc(o.ph||" ")}">${esc(val)}</textarea><label for="${esc(id)}">${esc(label)}</label></div>`;
}
function sf(path,label,val,opts,o={}){
  const bind=o.form?`data-f="${esc(path)}"`:`data-bind="${esc(path)}"`, id=o.form?"f_"+path:path;
  return `<div class="tf fl${o.full?" full":""}"><select id="${esc(id)}" ${bind}>${opts.map(x=>{ const [v,t]=Array.isArray(x)?x:[x,x]; return `<option value="${esc(v)}" ${v===val?"selected":""}>${esc(t||"–")}</option>`; }).join("")}</select><label for="${esc(id)}">${esc(label)}</label><span class="arr">${icon("drop")}</span></div>`;
}
const datalist=(id,vals)=>`<datalist id="${id}">${[...new Set(vals.map(v=>String(v||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de",{numeric:true})).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`;

function wann(ts){ if(!ts) return ""; const d=new Date(ts), h=new Date(); const tage=Math.round((new Date(h.toDateString())-new Date(d.toDateString()))/864e5);

const POI_RANG=["supermarket","place_of_worship","fuel","station","townhall","school","pharmacy","hospital","fire_station","bank"];
async function kartePoiHolen(g){ const key=g.lat.toFixed(4)+","+g.lon.toFixed(4); META.poi=META.poi||{}; const alt=META.poi[key]; if(alt&&Date.now()-alt.t<30*864e5) return alt.L;
  const um=`(around:800,${g.lat},${g.lon})`, q=`[out:json][timeout:15];(nwr${um}["shop"="supermarket"];nwr${um}["amenity"~"^(place_of_worship|fuel|school|pharmacy|townhall|hospital|bank|fire_station)$"];nwr${um}["railway"="station"];);out center 80;`;
  /* Overpass-Server sind oft ausgelastet: nacheinander drei probieren, je max. 12 s */
  let j=null;
  for(const srv of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"]){
    const ab=new AbortController(), t=setTimeout(()=>ab.abort(),12000);
    try{ const r=await fetch(srv,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ab.signal}); if(r.ok){ j=await r.json(); if(j&&Array.isArray(j.elements)) break; j=null; } }catch(e){} finally{ clearTimeout(t); } }
  if(!j) throw new Error("Anhaltspunkte nicht erreichbar");
  const d=(a,b)=>Math.hypot((a.lat-b.lat)*111000,(a.lon-b.lon)*111000*Math.cos(a.lat*Math.PI/180));
  let L=(j.elements||[]).map(e=>{ const t=e.tags||{}, art=t.shop==="supermarket"?"supermarket":t.railway==="station"?"station":t.amenity, lat=e.lat||(e.center&&e.center.lat), lon=e.lon||(e.center&&e.center.lon);
    return POI_ART[art]&&lat?{art,lat,lon,n:String(t.name||t.brand||POI_ART[art][0]).slice(0,28)}:null; }).filter(Boolean);
  L.forEach(x=>x.d=d(x,g)); L=L.filter(x=>x.d>25).sort((a,b)=>POI_RANG.indexOf(a.art)-POI_RANG.indexOf(b.art)||a.d-b.d);
  const W=[]; for(const x of L){ if(W.length>=12) break; if(W.some(y=>d(x,y)<90)) continue; W.push({art:x.art,lat:x.lat,lon:x.lon,n:x.n}); }
  META.poi[key]={t:Date.now(),L:W}; const ks=Object.keys(META.poi); if(ks.length>60) delete META.poi[ks[0]]; metaSave(); return W; }
async function kartePoi(g,a){ (KARTE.poi||[]).forEach(m=>m.remove()); KARTE.poi=[];
  let L=[]; try{ L=await kartePoiHolen(g); }catch(e){ console.warn("Anhaltspunkte:",e.message); KARTE.poiA=null; return; }
  const el=document.getElementById("kdKarte"); if(!el||el.dataset.a!==a||!KARTE.map) return;
  KARTE.poi=L.map(x=>{ const [t,f,pfad]=POI_ART[x.art], d=document.createElement("div"); d.className="kd-poi"; d.title=`${t}: ${x.n}`;
    d.addEventListener("click",e=>{ e.stopPropagation(); const an=!d.classList.contains("zeig"); document.querySelectorAll(".kd-poi.zeig").forEach(x=>x.classList.remove("zeig")); d.classList.toggle("zeig",an); });
    d.innerHTML=`<i style="--poi:${f}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${pfad}"/></svg></i><span>${esc(x.n)}</span>`;
    return new maplibregl.Marker({element:d,anchor:"left",offset:[-13,0]}).setLngLat([x.lon,x.lat]).addTo(KARTE.map); });
  if(KARTE.mk){ const p=KARTE.mk.getElement(); p.parentNode&&p.parentNode.appendChild(p); } }
function karteVorlagePoiAus(){ try{ const st=KARTE.map.getStyle(); (st&&st.layers||[]).forEach(l=>{ if(/^poi/.test(l.id)) KARTE.map.setLayoutProperty(l.id,"visibility","none"); }); }catch(e){} }
const karteGrenze=c=>[[c[0]-.022,c[1]-.014],[c[0]+.022,c[1]+.014]];
async function karteLaden(a){
  const el=document.getElementById("kdKarte"); if(!el||el.dataset.a!==a) return;
  let g; try{ g=await karteGeo(a); }catch(e){ return karteFehler(el,"Karte gerade nicht erreichbar"); }
  if(g.nix) return karteFehler(el,"Adresse auf der Karte nicht gefunden");
  try{ await karteLib(); }catch(e){ return karteFehler(el,"Karte gerade nicht erreichbar"); }
  const el2=document.getElementById("kdKarte"); if(!el2||el2.dataset.a!==a) return;
  const slot=el2.querySelector(".kd-slot"), stil=kDunkel()?"satellit":"liberty", c=[g.lon,g.lat];
  if(!KARTE.map){
    KARTE.el=document.createElement("div"); KARTE.el.className="kd-map"; slot.appendChild(KARTE.el); KARTE.stil=stil;
    /* Umschauen erlaubt, aber nur in der Nähe: Zoom 13,5–18,5 und ca. 1,5 km um den Ort. Finger: mit zwei Fingern, PC: Strg/⌘ + Mausrad oder +/− */
    KARTE.map=new maplibregl.Map({container:KARTE.el,style:karteStil(stil),center:c,zoom:15.2,minZoom:13.5,maxZoom:18.5,maxBounds:karteGrenze(c),
      dragRotate:false,pitchWithRotate:false,touchPitch:false,keyboard:false,cooperativeGestures:true,attributionControl:false,fadeDuration:0,
      locale:{"CooperativeGesturesHandler.WindowsHelpText":"Zum Zoomen Strg + Mausrad – oder + und −","CooperativeGesturesHandler.MacHelpText":"Zum Zoomen ⌘ + Mausrad – oder + und −","CooperativeGesturesHandler.MobileHelpText":"Mit zwei Fingern verschieben und zoomen",
        "NavigationControl.ZoomIn":"Vergrößern","NavigationControl.ZoomOut":"Verkleinern"}});
    KARTE.map.touchZoomRotate.disableRotation();
    KARTE.map.on("styledata",karteVorlagePoiAus);
    KARTE.map.on("zoom",()=>{ const k=document.getElementById("kdKarte"); if(k) k.classList.toggle("fern",KARTE.map.getZoom()<14.6); });
    KARTE.map.addControl(new maplibregl.AttributionControl({compact:true}),"bottom-right");
    /* Quellenangabe immer eingeklappt (nur das ⓘ); MapLibre klappt sie beim ersten Laden von selbst auf – das wird sofort zurückgenommen, außer man hat selbst aufs ⓘ getippt */
    { const at=KARTE.el.querySelector(".maplibregl-ctrl-attrib"); let tipp=0;
      if(at){ at.addEventListener("pointerdown",e=>{ if(e.target.closest(".maplibregl-ctrl-attrib-button")) tipp=Date.now(); },true);
        const zu=()=>{ if(at.classList.contains("maplibregl-compact-show")&&Date.now()-tipp>800) at.classList.remove("maplibregl-compact-show"); };
        new MutationObserver(zu).observe(at,{attributes:true,attributeFilter:["class"]}); zu(); } }
    KARTE.map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
    KARTE.map.on("moveend",()=>{ const z=document.querySelector("#kdKarte .kd-zentr"); if(!z||!KARTE.mk) return; const m=KARTE.map.project(KARTE.mk.getLngLat()), cc=KARTE.map.project(KARTE.map.getCenter());
      z.hidden=Math.hypot(m.x-cc.x,m.y-cc.y)<30&&Math.abs(KARTE.map.getZoom()-15.2)<.3; });
    /* falls der dunkle Kartenstil nicht lädt: hellen nehmen */
    KARTE.map.on("error",ev=>{ if(KARTE.stil==="liberty"&&!KARTE.map.isStyleLoaded()&&!KARTE.ersatz){ KARTE.ersatz=1; KARTE.stil="positron"; KARTE.map.setStyle(karteStil("positron")); } });
    if(window.ResizeObserver) new ResizeObserver(()=>{ if(KARTE.map&&KARTE.el.isConnected) KARTE.map.resize(); }).observe(KARTE.el);
    const m=document.createElement("div"); m.className="kd-pin"; KARTE.mk=new maplibregl.Marker({element:m,anchor:"bottom"}).setLngLat(c).addTo(KARTE.map);
  } else {
    slot.appendChild(KARTE.el); KARTE.map.resize();
    if(KARTE.stil!==stil){ KARTE.stil=stil; KARTE.map.setStyle(karteStil(stil)); }
    const alt=KARTE.mk.getLngLat(); KARTE.mk.setLngLat(c); KARTE.map.setMaxBounds(karteGrenze(c));
    if(Math.abs(alt.lng-c[0])+Math.abs(alt.lat-c[1])>1e-6) KARTE.map.easeTo({center:c,duration:500}); else KARTE.map.jumpTo({center:c});
  }
  const l=el2.querySelector(".kd-lade"); if(l) l.hidden=true;
  if(KARTE.poiA!==a||!(KARTE.poi||[]).length){ KARTE.poiA=a; kartePoi(g,a); }
}

function openStores(name,stores,meta){ return new Promise((res,rej)=>{
  if(!window.indexedDB) return rej(0);
  const anlegen=db=>{ stores.forEach(s=>{ if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:"id"}); }); if(meta&&!db.objectStoreNames.contains("meta")) db.createObjectStore("meta"); };
  const r=indexedDB.open(name);
  r.onupgradeneeded=()=>anlegen(r.result);
  r.onsuccess=()=>{ const db=r.result, fehlt=stores.some(s=>!db.objectStoreNames.contains(s))||(meta&&!db.objectStoreNames.contains("meta"));
    if(!fehlt){ db.onversionchange=()=>db.close(); return res(db); }
    const v=db.version+1; db.close(); const r2=indexedDB.open(name,v);
    r2.onupgradeneeded=()=>anlegen(r2.result); r2.onsuccess=()=>{ r2.result.onversionchange=()=>r2.result.close(); res(r2.result); }; r2.onerror=()=>rej(r2.error); };
  r.onerror=()=>rej(r.error); }); }
const dbOf=k=>APP_KINDS.includes(k)?aDB:kDB;
function dbPut(kind,rec){ DB[kind].set(rec.id,rec); const db=dbOf(kind); if(!db) return;
  try{ const t=db.transaction(kind,"readwrite"); t.objectStore(kind).put(rec); t.onerror=t.onabort=storageWarn; }catch(e){ storageWarn(); } }
function dbDelHard(kind,id){ DB[kind].delete(id); const db=dbOf(kind); if(db) try{ db.transaction(kind,"readwrite").objectStore(kind).delete(id); }catch(e){} }
function metaSave(){ if(eDB) try{ eDB.transaction("meta","readwrite").objectStore("meta").put(META,"meta"); }catch(e){} }
async function dataLoad(){
  try{ kDB=await openStores("evse_daten",KUNDEN_KINDS,false); eDB=await openStores("echeck_daten",["anlagen","geraete"],true); aDB=await openStores("irrgang_apps",["einstellungen",...APP_KINDS],true);
    for(const k of KINDS){ (await idbReq(dbOf(k).transaction(k).objectStore(k).getAll())).forEach(r=>DB[k].set(r.id,r)); }
    const m=await idbReq(eDB.transaction("meta").objectStore("meta").get("meta")); if(m) META=Object.assign(META,m);
  }catch(e){ kDB=eDB=aDB=null; toast("Gerätespeicher nicht verfügbar – Daten nur bis zum Schließen"); }
}

let updWartet=false, updLetzteEingabe=Date.now();

  const dlg=document.getElementById("dlg"); if(dlg&&!dlg.hidden) return false;

  const m=document.getElementById("menu"); if(m&&!m.hidden) return false;

async function testAnmelden(){
  const mail=(tlSel==="__andere"?($("#f_tlMail")||{}).value||"":tlSel||"").trim().toLowerCase(), pw=$("#f_tlPw").value||"";
  if(!mail){ toast("Bitte auswählen, wer sich anmeldet"); return; }
  if(!mail.endsWith(TEST_LOGIN.domain)){ toast(`Bitte die Arbeitsadresse (…${TEST_LOGIN.domain}) eingeben`); return; }
  if(gesperrt(mail)){ toast("Kein Zugang – bitte beim Chef melden"); return; }
  let ok=false; try{ ok=(await sha256(TEST_LOGIN.salt+"|"+pw))===TEST_LOGIN.hash; }catch(e){ toast("Anmeldung auf diesem Gerät nicht möglich"); return; }
  if(!ok){ toast("Passwort falsch"); $("#f_tlPw").value=""; $("#f_tlPw").focus(); return; }
  const m=team().find(x=>x.mail===mail)||{name:mail.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g,c=>c.toUpperCase()),mail};
  loginMerken(m); ichBin(m); META.angemeldet={mail,at:Date.now()}; metaSave(); go({v:"start"}); toast(`Angemeldet als ${m.name}`);
}
document.addEventListener("submit",ev=>{ if(ev.target.id==="tlForm"){ ev.preventDefault(); testAnmelden(); } });

document.addEventListener("click",ev=>{

  case "newKunde": locDialog("kunden"); return;
  case "newStandort": locDialog("standorte",null,nav.id); return;

  }
});

<script>/* Hintergrund sperren, solange ein Pop-up offen ist */
(()=>{ const pr=()=>{ const d=document.getElementById("dlg"), s=document.getElementById("scrim");
